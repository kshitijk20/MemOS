# Serves the built SPA. TLS and /api routing are handled by Caddy in front of this container.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Hashed build assets never change, so they can be cached for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must not be cached, or users keep loading old asset hashes after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routes (/conversations/123, /documents, ...) all load the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
