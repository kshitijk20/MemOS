# Production stack for a single server (e.g. an Oracle Cloud Always Free ARM VM).
#
#   cp .env.prod.example .env.prod   # then fill it in
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Only Caddy is reachable from outside (ports 80/443). It gets HTTPS certificates
# automatically and serves the app and the API on one domain, so no CORS setup is needed.
name: memos-prod

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-memos}
      POSTGRES_USER: ${DB_USER:-memos}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.prod}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-memos} -d ${DB_NAME:-memos}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Only caches (embeddings, ingestion progress) live here, so bound memory and evict
    # least-recently-used keys instead of growing without limit.
    command: ["redis-server", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-memos}
      DB_USER: ${DB_USER:-memos}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.prod (openssl rand -base64 64)}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY in .env.prod}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MEMOS_DEFAULT_AI_PROVIDER: ${MEMOS_DEFAULT_AI_PROVIDER:-GEMINI}
      MEMOS_CORS_ALLOWED_ORIGINS: https://${DOMAIN}
      MEMOS_RAG_QUERY_REWRITE_ENABLED: ${MEMOS_RAG_QUERY_REWRITE_ENABLED:-false}
      # API docs are for development; don't publish them.
      SPRINGDOC_APIDOCS_ENABLED: "false"
      SPRINGDOC_SWAGGERUI_ENABLED: "false"
    volumes:
      - uploads:/app/uploads
    deploy:
      resources:
        limits:
          memory: 4g
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5

  frontend:
    build: ./frontend
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env.prod, e.g. memos.duckdns.org}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  # Nightly compressed database dump, keeping the last BACKUP_KEEP_DAYS days in ./backups.
  # These stay on the same server; copy them elsewhere too (see docs/deploy-oracle.md).
  db-backup:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    # Wait for the backend so its migrations have created the schema before the first dump.
    depends_on:
      backend:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${DB_USER:-memos}
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: ${DB_NAME:-memos}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          file=/backups/memos-$$(date +%Y%m%d-%H%M%S).sql.gz
          # --clean --if-exists: the dump drops and recreates objects, so it restores into an
          # existing database (the backend creates the schema on startup).
          if pg_dump --no-owner --clean --if-exists | gzip > "$$file.tmp"; then
            mv "$$file.tmp" "$$file" && echo "backup written: $$file"
          else
            rm -f "$$file.tmp"; echo "backup FAILED" >&2
          fi
          find /backups -name 'memos-*.sql.gz' -mtime +$$BACKUP_KEEP_DAYS -delete
          sleep 86400
        done

volumes:
  postgres-data:
  uploads:
  caddy-data:
  caddy-config:
