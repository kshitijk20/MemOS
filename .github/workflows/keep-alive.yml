name: Keep backend awake

# Render's free plan puts the backend to sleep after 15 minutes without traffic, and the next
# visitor then waits for it to start. Pinging the health endpoint regularly keeps it running.
# The health check doesn't touch the database or Redis, so pings don't use Neon or Upstash quota.
#
# GitHub may delay scheduled runs under load, and disables schedules in repos with no activity
# for 60 days (re-enable under Actions). For tighter timing, use an uptime monitor instead
# (see docs/deploy-free.md, step 6).
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint
        env:
          HEALTH_URL: ${{ vars.BACKEND_HEALTH_URL || 'https://memos-backend-4bkg.onrender.com/actuator/health' }}
        # Retries cover a cold start, which can take a minute or two.
        run: curl -fsS --retry 4 --retry-delay 30 --retry-all-errors --max-time 120 "$HEALTH_URL"
