spring:
  application:
    name: memos-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:memos}?reWriteBatchedInserts=true
    username: ${DB_USER:memos}
    password: ${DB_PASSWORD:memos}
    hikari:
      # Lower on small hosts (e.g. 512 MB) to save memory and database connections.
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
          # Chunks are saved in bulk at the end of ingestion; send them as JDBC batches
          # rather than one INSERT round trip each.
          batch_size: 100
        order_inserts: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Fail fast if Redis is down: rate limits then allow requests instead of hanging them.
      timeout: 2s

  cache:
    type: redis

  servlet:
    multipart:
      # Lower these on small hosts: parsing a large PDF needs memory proportional to its size.
      max-file-size: ${MEMOS_MAX_UPLOAD_SIZE:50MB}
      # headroom over max-file-size for multipart boundaries and the title field
      max-request-size: ${MEMOS_MAX_REQUEST_SIZE:51MB}

  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# Application-specific configuration
memos:
  jwt:
    # Required, no default: a default secret would be public in the repository. JwtService
    # refuses to start without a real one. Generate with: openssl rand -base64 64
    secret: ${JWT_SECRET:}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:3600000}    # 1 hour
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
    issuer: memos-backend

  # Who can sign up. With an invite code set, only people you give it to can register.
  auth:
    registration-enabled: ${MEMOS_REGISTRATION_ENABLED:true}
    invite-code: ${MEMOS_INVITE_CODE:}

  # Base URL of the web app, used in links sent by email (e.g. password reset).
  app:
    frontend-url: ${MEMOS_FRONTEND_URL:http://localhost:3000}

  # Transactional email via Brevo's HTTP API (free tier: 300/day). Without an API key and sender,
  # emails are logged instead of sent. The sender address must be verified in Brevo.
  mail:
    brevo-api-key: ${BREVO_API_KEY:}
    from-email: ${MAIL_FROM_EMAIL:}
    from-name: ${MAIL_FROM_NAME:MemOS}
    reset-emails-per-address-per-hour: 3
    reset-emails-per-day: 250

  # Per-user limits so one account can't use up the shared AI quota or the server's storage.
  # 0 disables a limit.
  limits:
    questions-per-minute: ${MEMOS_LIMIT_QUESTIONS_PER_MINUTE:5}
    questions-per-day: ${MEMOS_LIMIT_QUESTIONS_PER_DAY:200}
    ingestions-per-hour: ${MEMOS_LIMIT_INGESTIONS_PER_HOUR:20}
    max-documents-per-user: ${MEMOS_LIMIT_MAX_DOCUMENTS:100}
    max-chunks-per-user: ${MEMOS_LIMIT_MAX_CHUNKS:20000}

  ai:
    default-provider: ${MEMOS_DEFAULT_AI_PROVIDER:GEMINI}
    embedding:
      provider: GEMINI
      dimensions: 768
      # Gemini's free-tier embedding quota is exceeded by a single large batch request
      # (e.g. ~50+ chunks from a multi-page PDF), so large documents are embedded in
      # smaller sub-batches, paced to stay under an estimated tokens-per-minute budget.
      max-batch-size: ${MEMOS_EMBEDDING_MAX_BATCH_SIZE:8}
      tokens-per-minute: ${MEMOS_EMBEDDING_TOKENS_PER_MINUTE:10000}
    providers:
      # Gemini (Google Generative Language API) - default provider, free tier.
      # No dedicated Spring AI starter exists for it, so it is accessed through Google's
      # OpenAI-compatible endpoint using the spring-ai-openai client classes.
      gemini:
        api-key: ${GEMINI_API_KEY:}
        base-url: https://generativelanguage.googleapis.com/v1beta/openai
        chat-model: ${GEMINI_CHAT_MODEL:gemini-2.5-flash}
        embedding-model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
        temperature: 0.3

      # OpenAI - optional provider, requires the user's own paid API key
      openai:
        api-key: ${OPENAI_API_KEY:}
        base-url: https://api.openai.com
        chat-model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
        embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
        temperature: 0.3

      # Anthropic Claude - optional provider, requires the user's own paid API key
      claude:
        api-key: ${ANTHROPIC_API_KEY:}
        base-url: https://api.anthropic.com
        chat-model: ${ANTHROPIC_CHAT_MODEL:claude-3-5-sonnet-latest}
        temperature: 0.3
        max-tokens: 1024

  rag:
    top-k: ${MEMOS_RAG_TOP_K:5}
    history-window: ${MEMOS_RAG_HISTORY_WINDOW:10}
    max-context-chars: 12000
    candidate-pool: ${MEMOS_RAG_CANDIDATE_POOL:20}
    min-score: ${MEMOS_RAG_MIN_SCORE:0.35}
    rrf-k: ${MEMOS_RAG_RRF_K:60}
    # Rewrites follow-up questions ("what about the second one?") into standalone search
    # queries using the chat history. Costs one extra LLM call per follow-up.
    query-rewrite:
      enabled: ${MEMOS_RAG_QUERY_REWRITE_ENABLED:true}

  ingestion:
    chunk-size-tokens: 500
    chunk-overlap-tokens: 50
    max-upload-size-bytes: 52428800
    # Where uploads wait until ingestion succeeds (kept on failure so Retry works). Defaults to
    # the OS temp dir; production mounts a volume here so it survives container restarts.
    upload-dir: ${MEMOS_UPLOAD_DIR:${java.io.tmpdir}}
    git:
      allowed-extensions: .md,.markdown,.txt,.java,.py,.js,.ts,.tsx,.jsx,.go,.rb,.rs,.kt,.yaml,.yml,.json,.adoc,.rst
      max-file-size-bytes: 1048576
      clone-timeout-seconds: 120

  cors:
    allowed-origins: ${MEMOS_CORS_ALLOWED_ORIGINS:http://localhost:3000}

logging:
  level:
    com.memos: INFO
    org.hibernate.SQL: WARN
