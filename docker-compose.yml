services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: memos-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-memos}
      POSTGRES_USER: ${DB_USER:-memos}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-memos}
    ports:
      - "5432:5432"
    volumes:
      - memos-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-memos} -d ${DB_NAME:-memos}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: memos-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: memos-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-memos}
      DB_USER: ${DB_USER:-memos}
      DB_PASSWORD: ${DB_PASSWORD:-memos}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MEMOS_DEFAULT_AI_PROVIDER: ${MEMOS_DEFAULT_AI_PROVIDER:-GEMINI}
      MEMOS_CORS_ALLOWED_ORIGINS: ${MEMOS_CORS_ALLOWED_ORIGINS:-http://localhost:3000}

volumes:
  memos-postgres-data:
